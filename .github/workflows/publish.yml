name: Publish to npm

# Publishes with provenance (npm shows a verified link from the package to this repository and commit).
# Run it by publishing a GitHub release whose tag is v<version> (for example v1.5.4).
# Needs the repository secret NPM_TOKEN (an npm automation token).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release tag must match package.json
        if: github.event_name == 'release'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Publish with provenance
        # prepublishOnly rebuilds the pack manifest and runs the full test suite first.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
